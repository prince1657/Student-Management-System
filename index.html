<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPulse - Modern Student Management System</title>
  <meta name="description" content="Role-based Student Management System supporting Admin, Teacher, Student, and Parent portals." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Design System CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">E</div>
        <span class="brand-title">EduPulse</span>
        <span class="role-badge-sidebar" id="sidebar-role-tag">ADMIN</span>
      </div>

      <nav class="sidebar-nav" id="sidebar-navigation">
        <!-- Dynamic Navigation Items Populated by JS -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-mini">
          <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150" id="user-avatar-display" class="avatar" alt="User Profile" />
          <div class="user-info">
            <span class="user-name" id="user-name-display">Dr. Eleanor Vance</span>
            <span class="user-role" id="user-role-display">ADMIN</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Sidebar Navigation">☰</button>
          <h1 class="page-header-title" id="page-title">Dashboard Overview</h1>
        </div>

        <div class="topbar-right">
          <!-- Role Switcher -->
          <div class="role-switch-container" title="Switch Role Perspective">
            <button class="role-btn active" data-role="admin" onclick="Auth.switchRole('admin')">👑 Admin</button>
            <button class="role-btn" data-role="teacher" onclick="Auth.switchRole('teacher')">👨‍🏫 Teacher</button>
            <button class="role-btn" data-role="student" onclick="Auth.switchRole('student')">🎓 Student</button>
            <button class="role-btn" data-role="parent" onclick="Auth.switchRole('parent')">👨‍👩‍👧 Parent</button>
          </div>

          <!-- Theme Mode Switcher -->
          <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Light/Dark Theme">
            🌙
          </button>

          <!-- Notification Bell -->
          <button class="notif-btn" title="View Notifications" onclick="UI.showToast('You have 2 new unread notices', 'info')">
            🔔
            <span class="notif-badge">2</span>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Page Body -->
      <main class="content-body" id="view-content">
        <!-- Rendered Views Inject Here -->
      </main>
    </div>
  </div>

  <!-- Reusable Modal Backdrop -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Modal Title</h3>
        <button class="modal-close" onclick="UI.hideModal()">✖</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Form Content -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <!-- Dynamic Action Buttons -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Application JavaScript Modules -->
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/teacher.js"></script>
  <script src="js/views/student.js"></script>
  <script src="js/views/parent.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
